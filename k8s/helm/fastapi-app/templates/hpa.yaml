apiVersion: autoscaling/v2                          # HPA's own schema — separate from apps/v1 (Deployments)
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.appName }}-hpa
spec:
  scaleTargetRef:                                    # WHICH Deployment this HPA controls
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.appName }}-deployment          # must exactly match your Deployment's real name
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:                                           # WHAT signal drives scaling decisions
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilization }}