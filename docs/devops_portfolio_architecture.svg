<svg width="100%" viewBox="0 0 920 944" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>DevOps Portfolio architecture</title>
  <desc>A developer pushes to GitHub. One GitHub Actions CI/CD pipeline runs quality gates (Ruff, pytest, Helm lint, kubeconform, Terraform validate, tfsec) on every push or PR, and on a version tag builds the image, scans it with Trivy, and pushes it to a private ghcr.io repository. That single container image feeds two independent deployment routes. Route A deploys to a local Kubernetes (kind) cluster via a Helm chart: Gateway, HTTPRoute, ClusterIP Service and a FastAPI Deployment with ConfigMap, Secret and an HPA. Route B provisions AWS with Terraform (EC2 with an IAM role, IMDSv2 and an encrypted disk, S3 remote state, Secrets Manager) and configures the host with Ansible, which logs in to GHCR using the token from Secrets Manager, pulls the image and runs the container. Prometheus scrapes the Kubernetes deployment through a ServiceMonitor and Grafana displays the metrics on a dashboard.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#5B6675" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="920" height="944" fill="#F7F8FA"/>

  <!-- ===== Header ===== -->
  <text x="70" y="45" font-size="23" font-weight="700" fill="#1F2933">DevOps Portfolio Architecture</text>
  <text x="70" y="68" font-size="13" fill="#5B6675">One FastAPI service · one CI/CD pipeline · two deployment routes · monitoring</text>

  <!-- legend -->
  <line x1="690" y1="40" x2="722" y2="40" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="730" y="44" font-size="11" fill="#5B6675">Build and deploy flow</text>
  <line x1="690" y1="60" x2="722" y2="60" stroke="#5B6675" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="730" y="64" font-size="11" fill="#5B6675">Metrics flow</text>

  <!-- ===== Developer ===== -->
  <rect x="360" y="96" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1.2"/>
  <text x="460" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2933">Developer</text>
  <text x="460" y="138" text-anchor="middle" font-size="11" fill="#5B6675">git push · pull request · git tag v*</text>
  <line x1="460" y1="148" x2="460" y2="170" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="163" font-size="9.5" fill="#5B6675">triggers workflows</text>

  <!-- ===== CI/CD ===== -->
  <rect x="70" y="172" width="780" height="200" rx="10" fill="#EEF1F5" stroke="#9AA5B4" stroke-width="1.2"/>
  <rect x="86" y="187" width="12" height="12" rx="2" fill="#1E3A5F"/>
  <text x="104" y="197" font-size="14" font-weight="700" fill="#1E3A5F">GitHub Actions CI/CD pipeline</text>

  <text x="86" y="217" font-size="11" font-weight="600" fill="#3E4C5E">On every push and pull request: quality gates</text>

  <!-- row 1: quality gates -->
  <g font-size="9.5">
    <rect x="92"  y="224" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
    <text x="147" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Ruff</text>
    <text x="147" y="256" text-anchor="middle" fill="#5B6675">lint + format</text>

    <rect x="217" y="224" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
    <text x="272" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">pytest</text>
    <text x="272" y="256" text-anchor="middle" fill="#5B6675">unit tests</text>

    <rect x="342" y="224" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
    <text x="397" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Helm</text>
    <text x="397" y="256" text-anchor="middle" fill="#5B6675">chart lint</text>

    <rect x="467" y="224" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
    <text x="522" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">kubeconform</text>
    <text x="522" y="256" text-anchor="middle" fill="#5B6675">manifest validation</text>

    <rect x="592" y="224" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
    <text x="647" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Terraform</text>
    <text x="647" y="256" text-anchor="middle" fill="#5B6675">fmt + validate</text>

    <rect x="717" y="224" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
    <text x="772" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">tfsec</text>
    <text x="772" y="256" text-anchor="middle" fill="#5B6675">IaC security scan</text>
  </g>

  <line x1="86" y1="286" x2="834" y2="286" stroke="#D5DBE3" stroke-width="1"/>
  <text x="86" y="305" font-size="11" font-weight="600" fill="#3E4C5E">On version tag v*: release</text>

  <!-- row 2: release -->
  <rect x="120" y="311" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="210" y="336" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2933">Build image</text>
  <line x1="300" y1="331" x2="356" y2="331" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="328" y="324" text-anchor="middle" font-size="9" fill="#5B6675">scan</text>

  <rect x="360" y="311" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="450" y="332" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2933">Trivy scan</text>
  <text x="450" y="345" text-anchor="middle" font-size="9" fill="#5B6675">CRITICAL / HIGH findings block push</text>
  <line x1="540" y1="331" x2="596" y2="331" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="568" y="324" text-anchor="middle" font-size="9" fill="#5B6675">if clean</text>

  <rect x="600" y="311" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="690" y="336" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2933">Push to ghcr.io</text>

  <text x="86" y="365" font-size="10" fill="#5B6675">Quality gates block merge to main · the image is built and pushed only on a version tag</text>

  <line x1="460" y1="372" x2="460" y2="386" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="383" font-size="9.5" fill="#5B6675">publishes release image</text>

  <!-- ===== Registry ===== -->
  <rect x="330" y="388" width="260" height="58" rx="8" fill="#FFFFFF" stroke="#9AA5B4" stroke-width="1.2"/>
  <rect x="346" y="404" width="12" height="12" rx="2" fill="#1E3A5F"/>
  <text x="364" y="414" font-size="15" font-weight="700" fill="#1E3A5F">ghcr.io</text>
  <text x="460" y="437" text-anchor="middle" font-size="10.5" fill="#5B6675">Private container registry · image :vX + :latest</text>

  <!-- fork -->
  <path d="M405 446 V474 Q405 482 397 482 H258 Q250 482 250 490 V514" fill="none" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M515 446 V474 Q515 482 523 482 H662 Q670 482 670 490 V514" fill="none" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="242" y="503" text-anchor="end" font-size="9.5" fill="#5B6675">pulled with image pull secret</text>
  <text x="678" y="503" font-size="9.5" fill="#5B6675">pulled by Ansible</text>
  <text x="460" y="503" text-anchor="middle" font-size="11" font-style="italic" fill="#5B6675">The same image feeds two independent deployment routes</text>

  <!-- ===== Route A: Kubernetes ===== -->
  <rect x="70" y="516" width="360" height="276" rx="10" fill="#EEF1F5" stroke="#9AA5B4" stroke-width="1.2"/>
  <rect x="86" y="531" width="12" height="12" rx="2" fill="#1E3A5F"/>
  <text x="104" y="541" font-size="13.5" font-weight="700" fill="#1E3A5F">Route A · Kubernetes (kind, local)</text>
  <text x="104" y="557" font-size="10" fill="#5B6675">Deployed with a Helm chart · Gateway API routing</text>

  <rect x="100" y="566" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="250" y="580" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Gateway</text>
  <text x="250" y="593" text-anchor="middle" font-size="9.5" fill="#5B6675">NGINX Gateway Fabric · HTTP :80</text>
  <line x1="250" y1="600" x2="250" y2="622" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="260" y="615" font-size="9" fill="#5B6675">routes by path</text>

  <rect x="100" y="624" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="250" y="638" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">HTTPRoute</text>
  <text x="250" y="651" text-anchor="middle" font-size="9.5" fill="#5B6675">path /</text>
  <line x1="250" y1="658" x2="250" y2="680" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="260" y="673" font-size="9" fill="#5B6675">forwards to backend</text>

  <rect x="100" y="682" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="250" y="696" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Service</text>
  <text x="250" y="709" text-anchor="middle" font-size="9.5" fill="#5B6675">ClusterIP :80</text>
  <line x1="250" y1="716" x2="250" y2="738" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="260" y="731" font-size="9" fill="#5B6675">load balances across pods</text>

  <rect x="100" y="740" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.3"/>
  <text x="250" y="754" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Deployment · FastAPI pods</text>
  <text x="250" y="767" text-anchor="middle" font-size="9.5" fill="#5B6675">HPA scales 1 to 5 at 70% CPU · ConfigMap + Secret as env</text>

  <!-- ===== Route B: AWS ===== -->
  <rect x="490" y="516" width="360" height="276" rx="10" fill="#EEF1F5" stroke="#9AA5B4" stroke-width="1.2"/>
  <rect x="506" y="531" width="12" height="12" rx="2" fill="#1E3A5F"/>
  <text x="524" y="541" font-size="13.5" font-weight="700" fill="#1E3A5F">Route B · AWS (Terraform, cloud)</text>
  <text x="524" y="557" font-size="10" fill="#5B6675">Provisioned as code · configured by Ansible</text>

  <rect x="520" y="566" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="670" y="580" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Terraform apply</text>
  <text x="670" y="593" text-anchor="middle" font-size="9.5" fill="#5B6675">state in S3 (encrypted, versioned, locked)</text>
  <line x1="670" y1="600" x2="670" y2="622" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="680" y="615" font-size="9" fill="#5B6675">provisions</text>

  <rect x="520" y="624" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="670" y="638" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">EC2 · t3.micro + Secrets Manager</text>
  <text x="670" y="651" text-anchor="middle" font-size="9.5" fill="#5B6675">IAM role · IMDSv2 · encrypted EBS · SG locked to my IP</text>
  <line x1="670" y1="658" x2="670" y2="680" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="680" y="673" font-size="9" fill="#5B6675">discovered by dynamic inventory</text>

  <rect x="520" y="682" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="670" y="696" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Ansible configures host</text>
  <text x="670" y="709" text-anchor="middle" font-size="9.5" fill="#5B6675">install Docker · GHCR login via Secrets Manager</text>
  <line x1="670" y1="716" x2="670" y2="738" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="680" y="731" font-size="9" fill="#5B6675">pulls image and runs container</text>

  <rect x="520" y="740" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.3"/>
  <text x="670" y="754" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Container running on EC2</text>
  <text x="670" y="767" text-anchor="middle" font-size="9.5" fill="#5B6675">port 80 · restart unless stopped · /health verified</text>

  <!-- ===== Observability ===== -->
  <line x1="250" y1="792" x2="250" y2="820" stroke="#5B6675" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="260" y="811" font-size="9.5" fill="#5B6675">/metrics scraped via ServiceMonitor</text>

  <rect x="70" y="822" width="780" height="104" rx="10" fill="#EEF1F5" stroke="#9AA5B4" stroke-width="1.2"/>
  <rect x="86" y="837" width="12" height="12" rx="2" fill="#1E3A5F"/>
  <text x="104" y="847" font-size="13.5" font-weight="700" fill="#1E3A5F">Observability · kube-prometheus-stack (monitoring namespace)</text>

  <rect x="95" y="860" width="310" height="38" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="250" y="875" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Prometheus</text>
  <text x="250" y="890" text-anchor="middle" font-size="9.5" fill="#5B6675">scrapes and stores app metrics · Operator managed</text>
  <line x1="405" y1="879" x2="511" y2="879" stroke="#5B6675" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="458" y="872" text-anchor="middle" font-size="9" fill="#5B6675">PromQL queries</text>

  <rect x="515" y="860" width="310" height="38" rx="6" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <text x="670" y="875" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2933">Grafana dashboard</text>
  <text x="670" y="890" text-anchor="middle" font-size="9.5" fill="#5B6675">requests/sec · p95 latency · 5xx error rate · pod count</text>

  <text x="460" y="915" text-anchor="middle" font-size="9.5" fill="#5B6675">Trimmed for a single-node kind cluster with hard CPU and memory limits on every component</text>
</svg>
