[defaults]
# Where Ansible looks for the inventory file (which hosts to target)
inventory = ./inventory.aws_ec2.yml

# The user Ansible connects as (Amazon Linux default is ec2-user)
remote_user = ec2-user

# The private key Ansible uses for SSH — same one you use manually
private_key_file = ~/.ssh/id_ed25519

# Skip the SSH host-key prompt — annoying on ephemeral EC2s that keep changing
# Fine for a personal learning project; in production you'd want strict checking
host_key_checking = False

# Only look for the collections you installed via requirements
# (avoids "did you mean..." warnings for modules not in the default paths)
collections_path = ~/.ansible/collections

[inventory]
# Enable the AWS EC2 dynamic inventory plugin
enable_plugins = amazon.aws.aws_ec2